[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchbox-m2-g4"
version = "0.1.0"
description = "Reproducible Matchbox EP/ADF technical foundation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<2.4", "scipy>=1.14", "numba>=0.61", "pandas>=2.2", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]
